[package]
name = "passa-facil"
version = "0.1.0"
description = "Passa Fácil — PDV para pequenos negócios"
authors = []
edition = "2021"

[lib]
name = "passa_facil_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
